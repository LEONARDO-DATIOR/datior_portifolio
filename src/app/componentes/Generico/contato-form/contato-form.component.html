<section class="section-formulario_contato">
    <div class="container__formulario_contato">
        <h2>Entre em contato:</h2>
        <form
            [formGroup]="formulario"
            (ngSubmit)="enviarFormulario()"
            class="formulario_contato"
        >
            <div class="nome-numero__formulario_contato">
                <div>
                    <small
                        style="color: rgb(184, 0, 0); top: -2em"
                        *ngIf="
                            formulario.get('primeiroNome')?.invalid &&
                            formulario.get('primeiroNome')?.touched
                        "
                    ></small>
                    <input
                        id="primeiroNomeCampo"
                        type="text"
                        class="campos"
                        formControlName="primeiroNome"
                        placeholder="Primeiro Nome"
                    />
                </div>

                <div>
                    <input
                        id="numero"
                        type="string"
                        class="campos"
                        formControlName="numero"
                        placeholder="Número"
                    />
                </div>
            </div>

            <div>
                <input
                    id="email"
                    type="email"
                    class="campos"
                    formControlName="email"
                    placeholder="E-mail"
                />
                <small
                    *ngIf="
                        formulario.get('email')?.invalid &&
                        formulario.get('email')?.touched
                    "
                >
                    Insira um e-mail válido.
                </small>
            </div>

            <div>
                <textarea
                    id="mensagem"
                    class="campos campo_textarea"
                    formControlName="mensagem"
                    placeholder="Mensagem"
                ></textarea>
            </div>

            <div class="botao">
                <app-botao-padrao
                    texto_botao="Enviar"
                    [submit_botao]="true"
                    [disabled_botao]="formulario.invalid"
                ></app-botao-padrao>
            </div>
        </form>
    </div>
</section>
