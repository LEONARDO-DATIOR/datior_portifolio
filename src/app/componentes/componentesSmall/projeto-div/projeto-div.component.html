<style>
    .projeto {
        transition: transform 0.8s ease;
        display: flex;
        flex-direction: column;
        box-shadow: 0px 0px 40px rgba(255, 255, 255, 0.2);
        border: 2px solid var(--fundo-branco);
        border-radius: 24px;
        width: 60vw;
        height: 50vh;
        padding: 2em 8em;

        .titulo_descricao__projeto {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-content: center;

            h4 {
                color: var(--cor-fonte-branca);
                font-size: 2em;
            }

            P {
                color: var(--cor-fonte-branca);
                opacity: 0.7;
                font-size: 1em;
            }
        }

        .tecnologias_github__projeto {
            display: flex;
            justify-content: space-between;
            margin: 2em 0;

            p {
                color: var(--cor-fonte-branca);
                border-radius: 23px;
                cursor: pointer;
            }
        }

        .img_projeto {
            position: relative;
            display: flex;
            height: 100%;

            img {
                position: absolute;
                width: 100%;
                max-height: 100%;
                object-fit: cover;
                border-radius: 12px;
                opacity: 50%;
            }

            a {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 2;
            }

            img:has(+ a:hover) {
                transition: 1s;
                opacity: 1;
            }
        }

        .github__projeto button {
            background: none;
            z-index: 1;
            color: var(--cor-fonte-branca);
            width: 120px;
            border: 1px solid var(--fundo-branco);
            border-radius: 23px;
        }

        .tecnologias__projeto {
            display: flex;
            gap: 2em;
        }
    }

    .projeto:hover {
        transform: translateY(-10px);
    }

    @media screen and (max-width: 1400px) {
        .projeto {
            padding: 2em 6em;
        }
    }

    @media screen and (max-width: 1030px) {
        .projeto {
            padding: 2em 4em;
        }
    }

    @media screen and (max-width: 768px) {
        .projeto {
            padding: 1em 1em;
            height: 45vh;

            .titulo_descricao__projeto {
                p {
                    display: none;
                }
            }

            .tecnologias_github__projeto {
                font-size: 12px;
            }

            .img_projeto {
                img {
                    object-fit: none;
                    height: 100%;
                }

                a {
                    width: 80%;
                }
            }
        }
    }
</style>

<div class="projeto">
    <div class="titulo_descricao__projeto">
        <h4>{{ titulo_projeto }}</h4>
        <p>{{ descricao_projeto }}</p>
    </div>
    <div class="tecnologias_github__projeto">
        <div class="tecnologias__projeto">
            <p href="#">Angular</p>
            <p href="#">React</p>
        </div>
        <div class="github__projeto">
            <a href="{{ link_github }}" target="_blank">
                <button>GITHUB</button>
            </a>
        </div>
    </div>
    <div class="img_projeto">
        <img [src]="caminho_imagem" alt="Imagem do projeto" />
        <a href="">
            <app-botao-padrao
                tipo_botao="botao_branco"
                texto_botao="Visualizar"
            ></app-botao-padrao>
        </a>
    </div>
</div>
