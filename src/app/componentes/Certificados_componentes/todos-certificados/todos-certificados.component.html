<style *ngIf="!carrosel">
    .section_certificados-todos {
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: var(--fundo-preto);
        padding: 4em 2em;
        min-height: 100vh;
    }

    .botao_exibir_filtros {
        display: none;
        background: none;
        color: white;
        margin: 2em auto;
        border: 1px solid white;
        border-radius: 22px;
        width: 160px;
    }

    .botao_fechar_filtros {
        display: block;
        background: none;
        color: white;
        font-size: large;
        font-weight: bold;
        margin: 2em auto;
        border: none;
    }

    .div_filtro_certificados {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 2em;
        margin-bottom: 6em;
        width: 100%;

        .botao_filtro {
            background: none;
            width: 125px;
            color: white;
            border: 3px solid;
            border-radius: 22px;

            &:hover {
                transition-duration: 0.7s;
                border: none;
                color: var(--fundo-preto);
                background: white;
                transform: scale(1.1);
                font-weight: bold;
            }
        }

        .front-end {
            border: 1px solid blue;
            color: blue;

            &:hover {
                transition-duration: 0.5s;
                border: none;
                color: var(--fundo-preto);
                background: blue;
            }
        }

        .back-end {
            border: 1px solid red;
            color: red;

            &:hover {
                border: none;
                transition-duration: 0.5s;
                border: none;
                color: var(--fundo-preto);
                background: red;
            }
        }

        .design {
            border: 1px solid purple;
            color: purple;

            &:hover {
                border: none;
                transition-duration: 0.5s;
                border: none;
                color: var(--fundo-preto);
                background: purple;
            }
        }

        .gestao {
            border: 1px solid orange;
            color: orange;

            &:hover {
                border: none;
                transition-duration: 0.5s;
                border: none;
                color: var(--fundo-preto);
                background: orange;
            }
        }

        .analise-de-dados {
            border: 1px solid green;
            color: green;

            &:hover {
                border: none;
                transition-duration: 0.5s;
                border: none;
                color: var(--fundo-preto);
                background: green;
            }
        }
    }

    .certificados_lista-todos {
        display: grid;
        grid-template-columns: repeat(auto-fit, 250px);
        justify-content: center;
        gap: 2em 6em;
        list-style: none;
        margin: 0 !important;
    }

    @media screen and (max-width: 768px) {
        .div_filtro_certificados {
            padding: 0 2em;
        }

        .section_certificados-todos {
            padding: 4em 0;
        }

        .certificados_lista-todos {
            padding: 0;
            gap: 4em;
        }
    }
</style>

<section class="section_certificados-todos" *ngIf="!carrosel">
    <button
        #btn_exibir_filtro
        class="botao_exibir_filtros"
        (click)="exibirFiltros(true)"
    >
        Exibir filtros
    </button>
    <button
        #btn_fechar_filtro
        class="botao_fechar_filtros"
        (click)="exibirFiltros(false)"
    >
        X
    </button>
    <div #div_filtros class="div_filtro_certificados">
        <button class="botao_filtro" (click)="filtrarCategoria('todos')">
            Todos
        </button>
        <button
            class="botao_filtro front-end"
            (click)="filtrarCategoria('FRONT-END')"
        >
            Front-end
        </button>
        <button class="botao_filtro design" (click)="filtrarCategoria('UI/UX')">
            Design
        </button>
        <button
            class="botao_filtro back-end"
            (click)="filtrarCategoria('BACK-END')"
        >
            Back-end
        </button>
        <button
            class="botao_filtro gestao"
            (click)="filtrarCategoria('METODOLOGIAS AGEIS')"
        >
            Gestão
        </button>
        <button class="botao_filtro" (click)="filtrarCategoria('REDES/CLOUD')">
            Infraestrutura
        </button>
    </div>
    <ul class="certificados_lista-todos">
        <app-certificado
            *ngFor="let certificado of certificadosFiltrados"
            [link]="
                certificado['LINK PARA CERTIFICAR'].includes('http')
                    ? certificado['LINK PARA CERTIFICAR']
                    : 'https://www.cursoemvideo.com/validacao-de-certificado/'
            "
            [titulo]="certificado['NOME CURSO']"
            [escola]="certificado['ESCOLA']"
            [dataRealizacao]="certificado['DATA']"
            [categoria]="certificado['CATEGORIA']"
        ></app-certificado>
    </ul>
</section>

<!-- CARROSEL -->
<style *ngIf="carrosel">
    .section_certificados-carrosel {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 50vh;
        background: var(--fundo-preto);
    }

    .certificados_lista-carrosel {
        display: grid;
        padding: 0;
        margin: 0;
        grid-template-columns: repeat(auto-fit, 250px);
        justify-content: center;
        width: 70%;
        gap: 2em 6em;
        list-style: none;
    }

    /* BOTAO CARROSEL */
    .btn-carrossel {
        width: 55px;
        height: 55px;

        display: flex;
        justify-content: center;
        align-items: center;

        background: transparent;
        color: var(--cor-fonte-branca);

        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 50%;

        cursor: pointer;

        font-size: 1.5rem;
        font-weight: 600;

        transition: 0.25s ease;
    }

    .btn-carrossel:hover {
        background: white;
        color: black;
        transform: scale(1.08);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .btn-carrossel:active {
        transform: scale(0.95);
    }

    .btn-carrossel:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }
    /* BOTAO CARROSEL */

    @media screen and (max-width: 768px) {
        .section_certificados-todos {
            padding: 4em 0;
        }
        .certificados_lista-todos {
            gap: 4em;
        }
    }
</style>
<section class="section_certificados-carrosel" *ngIf="carrosel">
    <button class="btn-carrossel" (click)="anterior()">❮</button>

    <ul class="certificados_lista-carrosel">
        <app-certificado
            *ngFor="let certificado of certificadosVisiveis"
            [link]="
                certificado['LINK PARA CERTIFICAR'].includes('http')
                    ? certificado['LINK PARA CERTIFICAR']
                    : 'https://www.cursoemvideo.com/validacao-de-certificado/'
            "
            [titulo]="certificado['NOME CURSO']"
            [escola]="certificado['ESCOLA']"
            [dataRealizacao]="certificado['DATA']"
            [categoria]="certificado['CATEGORIA']"
        ></app-certificado>
    </ul>
    <button class="btn-carrossel" (click)="proximo()">❯</button>
</section>
