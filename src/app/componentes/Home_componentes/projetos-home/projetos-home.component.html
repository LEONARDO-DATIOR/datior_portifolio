<section class="section_projetos-home">
    <div class="projetos-home__projetos">
        @for (projeto of projetos; track projeto) {
            <app-projeto
                [titulo_projeto]="projeto.titulo"
                [descricao_projeto]="projeto.descricao"
                [caminho_imagem]="projeto.caminho_imagem"
                [link_github]="projeto.link_github"
                [tecnologias]="projeto.tecnologias"
            ></app-projeto>
        }
    </div>
</section>
