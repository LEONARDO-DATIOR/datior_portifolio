<style>
    .section_sobre-home {
        width: 100%;
        height: 100vh;
        background: var(--fundo-preto);
        display: flex;
        justify-content: center;
    }

    .container_sobre-home {
        max-width: 1100px;
        max-height: 520px;
        margin: auto;
        padding: 3rem;
        border: 1px solid var(--fundo-cinza);
        border-radius: 20px;
        background: var(--fundo-preto);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 5rem;
    }

    .sobre-home__texto {
        display: flex;
        flex-direction: column;
        z-index: 2;
        max-width: 35%;
        gap: 1em;
    }

    .sobre-home__apelido {
        display: block;
        color: var(--cor-fonte-cinza);
        letter-spacing: 4px;
        font-size: 1em;
    }

    .sobre-home__titulo {
        display: flex;
        flex-direction: column;
        line-height: 0.9;
        margin-bottom: 1em;

        .sobre-home__titulo-principal {
            font-size: 2em;
            font-weight: 700;
            color: var(--cor-fonte-branca);
        }

        .sobre-home__titulo-outline {
            font-size: 2em;
            font-weight: 700;
            color: transparent;
            -webkit-text-stroke: 1px white;
        }
    }

    .sobre-home__descricao {
        color: var(--cor-fonte-cinza);
        margin: 2em;
    }

    .sobre-home__acoes {
        display: flex;
        gap: 1rem;
    }

    /* TROCAR COMPONENTES */
    .btn {
        height: 55px;
        padding: 0 2rem;
        border-radius: 12px;
        cursor: pointer;
        font-size: 1rem;
        transition: 0.3s;
    }

    .btn--primary {
        background: white;
        color: black;
        border: none;
    }

    .btn--secondary {
        background: transparent;
        color: white;
        border: 1px solid #555;
    }
    /* TROCAR COMPONENTES */

    .sobre-home__imagem {
        width: 50%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .sobre-home__imagem img {
        width: 100%;
        position: relative;
        filter: grayscale(100%);
    }

    @media screen and (max-width: 768px) {
        .section_sobre-home {
            height: auto;
            padding: 2rem 1rem;
        }

        .container_sobre-home {
            flex-direction: column-reverse;
            margin: 2rem 0;
            padding: 0 1em;
            max-height: none;
        }

        .sobre-home__texto {
            position: relative;
            top: -30%;
            max-width: 100%;
            height: 100px;
            align-items: center;
            text-align: center;
            gap: 0.5rem;
        }

        .sobre-home__titulo {
            margin-bottom: 0.5rem;
        }

        .sobre-home__titulo .sobre-home__titulo-principal,
        .sobre-home__titulo .sobre-home__titulo-outline {
            font-size: 2.5rem;
        }

        .sobre-home__descricao {
            margin: 0;
            max-width: 100%;
            line-height: 1.7;
        }

        .sobre-home__acoes {
            width: 100%;
            flex-direction: column;
            margin-top: 1rem;
        }

        .btn {
            width: 100%;
        }

        .sobre-home__imagem {
            width: 100%;
            max-width: 320px;
        }

        .sobre-home__imagem img {
            width: 100%;
        }
    }
</style>

<section class="section_sobre-home">
    <div class="container_sobre-home">
        <div class="sobre-home__texto">
            <span class="sobre-home__apelido">DATIOR</span>

            <h1 class="sobre-home__titulo">
                <span class="sobre-home__titulo-principal">LEONARDO</span>
                <span class="sobre-home__titulo-outline">DUCA</span>
            </h1>

            <p class="sobre-home__descricao">
                Transformo ideias em soluções digitais performáticas, funcionais
                e com foco em experiência.
            </p>

            <!-- TROCAR POR COMPONENTES -->
            <div class="sobre-home__acoes">
                <a href="contato">
                    <app-botao-padrao
                        tipo_botao="botao_branco"
                        texto_botao="CONTATO"
                    ></app-botao-padrao>
                </a>
            </div>
            <!-- TROCAR POR COMPONENTES -->
        </div>

        <div class="sobre-home__imagem">
            <img
                src="../../../../assets/imagens/foto_duca/DUCA_MVP.png"
                alt="Leonardo Duca"
            />
        </div>
    </div>
</section>
